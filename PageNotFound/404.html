
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        .error-code {
            font-size: 150px;
            font-weight: 800;
            color: #2563eb;
            line-height: 1;
            text-shadow: 5px 5px 0 #dbeafe;
        }

        .error-title {
            font-size: 32px;
            color: #1e293b;
            margin: 25px 0 12px;
        }

        .error-message {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 13px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #1d4ed8;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 100px;
            }

            .error-title {
                font-size: 24px;
            }

            .error-message {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="error-container">

        <h1 class="error-code">404</h1>

        <h2 class="error-title">Oops! Page Not Found</h2>

        <p class="error-message">
            Sorry, the page you are looking for might have been removed,
            had its name changed, or is temporarily unavailable.
        </p>

        <a href="/" class="home-btn">Back to Home</a>

    </div>

</body>
</html>
